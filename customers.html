<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="customers.css">
    <title>Dashboard</title>
</head>
<body>

    <section class="headerSec">

        <h2>STORAGE PROJECT</h2>

        <div>

            <button id="aboutButton">Home</button>
            <button id="profileButton">Profile</button>
            <button id="logoutButton">Logout</button>

        </div>
    </section>

    <main class="mainLayout">

    <section class="optionSec">

            <button id="dashboardButton">Dashboard</button>
            <button id="deliveriesButton">Deliveries</button>
            <button id="driversButton">Drivers</button>
            <button id="customersButton">Customers</button>
            <button id="employeeButton">Employees</button>
            <button id="reportsButton">Reports</button>

            
        

            <button id="settingsButton">Settings</button>
            <button id="reportsButton">Logout</button>

    </section>

    <section class="dashboardSec">

        <div class="dashboardHead">
            <h3>CUSTOMERS</h3>
            <p>Manage company customers and destination</p>
        </div>

        <div class="driverAdd">

            <button>[+ Add Customer ]</button>

            <input type="text" id="driverName" placeholder="Search customer...">
            <select id="driverId" name="driver">
                <option value="">Status</option>
                <option value="Available">Available</option>
                <option value="On Route">On Route</option>
            </select>
            
        </div>

        <div class="dashboardDelOverview">

            <h2>Drivers Overview</h2>

            <table>
                <tr>
                    <td>Customer</td>
                    <td>Contact</td>
                    <td>Address</td>
                    <td>Deliveries</td>
                    
                </tr>
                <tr>
                    <td>ABC Store</td>
                    <td>09999999999</td>
                    <td>Pasig</td>
                    <td>15</td>
                </tr>
            </table>

        </div>

    </section>

    </main>


</body>
</html>
