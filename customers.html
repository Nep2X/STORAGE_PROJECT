<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Customers | Storage Project</title>
</head>
<body>

    <header class="headerSec">
        <h2>DELIVERY PROJECT</h2>

        <div class="headerActions">
            <button id="aboutButton">Home</button>
            <button id="profileButton">Profile</button>
            <button id="logoutButton">Logout</button>
        </div>
    </header>

    <main class="mainLayout">

        <aside class="optionSec">
            <div class="sidebarTitle">MENU</div>

            <button id="dashboardButton" class="">Dashboard</button>
            <button id="deliveriesButton" class="">Deliveries</button>
            <button id="driversButton" class="">Drivers</button>
            <button id="customersButton" class="active">Customers</button>
            <button id="employeeButton" class="">Employees</button>
            <button id="reportsButton" class="">Reports</button>
            <button id="riderButton">Submit Delivery</button>
            <button id="settingsButton" class="">Settings</button>

            <div class="sidebarBottom">
                <button id="sidebarLogoutButton">Logout</button>
            </div>
        </aside>

        <section class="dashboardSec">

            <div class="dashboardHead">
                <div class="pageHead">
                    <h3>Customers</h3>
                    <p>Manage company customers and destinations</p>
                </div>
            </div>

            <div class="panel">
                <div class="toolbar">
                    <button class="btnPrimary" type="button" id="openAddCus">+ Add Customer</button>
                    <input type="text" id="customerSearch" placeholder="Search customer...">
                </div>
            </div>

            <div class="panel">
                <h2>Customers Overview</h2>
                <p>List of all registered customers</p>

                <div class="tableWrapper">
                    <table class="dataTable">
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Contact</th>
                                <th>Address</th>
                                <th>Deliveries</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add / Edit Customer Modal -->
            <div class="modal" id="customerModal">
                <div class="modalBox">
                    <div class="modalHeader">
                        <h2 id="cusModalTitle">Add Customer</h2>
                        <button class="modalClose" id="closeCusModal" type="button" aria-label="Close">&times;</button>
                    </div>

                    <form id="customerForm">
                        <label for="cusName">Customer Name</label>
                        <input type="text" id="cusName" name="name" required>

                        <label for="cusContact">Contact</label>
                        <input type="text" id="cusContact" name="contact" placeholder="09XXXXXXXXX">

                        <label for="cusAddress">Address</label>
                        <input type="text" id="cusAddress" name="address">

                        <div class="modalActions">
                            <button type="submit" class="btnPrimary">Save</button>
                            <button type="button" class="btnDanger" id="cancelCusModal">Cancel</button>
                        </div>
                    </form>
                </div>
</div>            
        </section>

    </main>

    <script src="app.js"></script>
    <script src="customers.js"></script></body>
</html>
