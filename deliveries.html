<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Deliveries | Storage Project</title>
<base target="_blank">
</head>
<body>

    <header class="headerSec">
        <h2>STORAGE PROJECT</h2>

        <div class="headerActions">
            <button id="aboutButton">Home</button>
            <button id="profileButton">Profile</button>
            <button id="logoutButton">Logout</button>
        </div>
    </header>

    <main class="mainLayout">

        <aside class="optionSec">
            <div class="sidebarTitle">MENU</div>

            <button id="dashboardButton" class="">Dashboard</button>
            <button id="deliveriesButton" class="active">Deliveries</button>
            <button id="driversButton" class="">Drivers</button>
            <button id="customersButton" class="">Customers</button>
            <button id="employeeButton" class="">Employees</button>
            <button id="reportsButton" class="">Reports</button>
            <button id="settingsButton" class="">Settings</button>

            <div class="sidebarBottom">
                <button id="sidebarLogoutButton">Logout</button>
            </div>
        </aside>

        <section class="dashboardSec">

            <div class="dashboardHead">
                <div class="pageHead">
                    <h3>Deliveries</h3>
                    <p>Manage all delivery transactions</p>
                </div>
            </div>

            <div class="panel">
                <div class="toolbar">
                    <button class="btnPrimary" id="openAddDel">+ New Delivery</button>
                    <input type="text" id="searchDelivery" placeholder="Search delivery...">
                    <select name="delStatus">
                        <option value="">Status</option>
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Out for Delivery">Out for Delivery</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                    <select name="driverName">
                        <option value="">Driver</option>
                    </select>
                    <input type="date" name="filterDate" aria-label="Filter by date">
                    <button class="btnOutline" type="button" id="filterBtn">Filter</button>
                    <button class="btnOutline" type="button" id="resetBtn">Reset</button>
                </div>
            </div>

            <div class="panel">
                <h2>Delivery List</h2>
                <p>All recorded deliveries</p>

                <div class="tableWrapper">
                    <table class="dataTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Driver</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add Delivery Modal -->
            <!-- Add / Edit Delivery Modal -->
<div class="modal" id="deliveryModal">
    <div class="modalBox">
        <div class="modalHeader">
            <h2 id="delModalTitle">Add Delivery</h2>
            <button class="modalClose" id="closeModal" type="button" aria-label="Close">&times;</button>
        </div>

        <form id="deliveryForm">
            <label for="delNumber">Delivery Number</label>
            <input type="text" id="delNumber" name="delNumber" required>

            <label for="customerName">Customer</label>
            <select id="customerName" name="customerName" required></select>

            <label for="delAddress">Delivery Address</label>
            <input type="text" id="delAddress" name="delAddress" placeholder="Enter delivery address">

            <label for="contactNumber">Contact Number</label>
            <input type="text" id="contactNumber" name="contactNumber" placeholder="09XXXXXXXXX">

            <label for="delDate">Delivery Date</label>
            <input type="date" id="delDate" name="delDate">

            <label for="driverAssign">Driver Assignment</label>
            <select id="driverAssign" name="driverAssign"></select>

            <label for="vehicle">Vehicle</label>
            <input type="text" id="vehicle" name="vehicle" placeholder="Vehicle plate / model">

            <label for="itemDesc">Item / Description</label>
            <input type="text" id="itemDesc" name="itemDesc" placeholder="Item description">

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" min="1" placeholder="0">

            <label for="delStatusField">Status</label>
            <select id="delStatusField" name="status">
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Out for Delivery">Out for Delivery</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
            </select>

            <label for="remarks">Remarks</label>
            <textarea id="remarks" name="remarks" rows="3" placeholder="Optional notes"></textarea>

            <div class="modalActions">
                <button type="submit" class="btnPrimary" id="delSubmitBtn">Add Delivery</button>
                <button type="button" class="btnDanger" id="cancelModal">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Update Status Modal -->
<div class="modal" id="statusModal">
    <div class="modalBox">
        <div class="modalHeader">
            <h2>Update Status</h2>
            <button class="modalClose" id="closeStatusModal" type="button" aria-label="Close">&times;</button>
        </div>

        <form id="statusForm">
            <label for="newStatus">Status</label>
            <select id="newStatus" name="status">
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Out for Delivery">Out for Delivery</option>
                <option value="Delivered">Delivered</option>
                <option value="Cancelled">Cancelled</option>
            </select>

            <div class="modalActions">
                <button type="submit" class="btnPrimary">Update</button>
                <button type="button" class="btnDanger" id="cancelStatusModal">Cancel</button>
            </div>
        </form>
    </div>
</div>

        </section>

    </main>

    <script src="app.js"></script>
    <script src="deliveries.js"></script>
</body>
</html>
