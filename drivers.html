<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
             <link rel="stylesheet" href="style.css"><script src="theme.js"></script>
      
    <title>Drivers | Delivery Project</title>
</head>
<body>

    <a class="skipLink" href="#pageContent">Skip to content</a>

    <header class="headerSec">
        <h2>DELIVERY PROJECT</h2>

        <div class="headerActions">
            <button id="aboutButton">Home</button>
            <button id="profileButton">Profile</button>
            <button id="logoutButton">Logout</button>
        </div>
    </header>

    <main class="mainLayout">

        <aside class="optionSec">
            <div class="sidebarTitle">MENU</div>

            <button id="dashboardButton" class="">Dashboard</button>
            <button id="deliveriesButton" class="">Deliveries</button>
            <button id="driversButton" class="active" aria-current="page">Drivers</button>
            <button id="mapButton">Live Map</button>
            <button id="customersButton" class="">Customers</button>
            <button id="employeeButton" class="">Employees</button>
            <button id="reportsButton" class="">Reports</button>
            <button id="riderButton">Submit Delivery</button>
            <button id="settingsButton" class="">Settings</button>

            <div class="sidebarBottom">
                <button id="sidebarLogoutButton">Logout</button>
            </div>
        </aside>

        <section class="dashboardSec" id="pageContent" tabindex="-1">

            <div class="dashboardHead">
                <div class="pageHead">
                    <h1>Drivers</h1>
                    <p>Drivers appear here automatically when a Driver account is created in Settings</p>
                </div>
            </div>

            <div class="panel">
                <div class="toolbar">
                    <input type="text" id="driverSearch" placeholder="Search driver...">
                    <select id="driverStatusFilter" name="driverStatus" aria-label="Filter by driver status">
                        <option value="">Status</option>
                        <option value="Available">Available</option>
                        <option value="On Route">On Route</option>
                        <option value="Offline">Offline</option>
                    </select>
                </div>
            </div>

            <div class="panel">
                <h2>Drivers Overview</h2>
                <p>List of all registered drivers</p>

                <div class="tableWrapper">
                    <table class="dataTable">
                        <thead>
                            <tr>
                                <th scope="col">Driver ID</th>
                                <th scope="col">Driver</th>
                                <th scope="col">Contact</th>
                                <th scope="col">Deliveries</th>
                                <th scope="col">Status</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>

                        <!-- Add / Edit Driver Modal -->
            <div class="modal" id="driverModal" role="dialog" aria-modal="true" aria-labelledby="drvModalTitle">
                <div class="modalBox">
                    <div class="modalHeader">
                        <h2 id="drvModalTitle">Add Driver</h2>
                        <button class="modalClose" id="closeDrvModal" type="button" aria-label="Close">&times;</button>
                    </div>

                    <form id="driverForm">
                        <label for="drvName">Driver Name</label>
                        <input type="text" id="drvName" name="name" required>

                        <label for="drvContact">Contact</label>
                        <input type="text" id="drvContact" name="contact" placeholder="09XXXXXXXXX">

                        <label for="drvStatus">Status</label>
                        <select id="drvStatus" name="status">
                            <option value="Available">Available</option>
                            <option value="On Route">On Route</option>
                            <option value="Offline">Offline</option>
                        </select>

                        <div class="modalActions">
                            <button type="submit" class="btnPrimary">Save</button>
                            <button type="button" class="btnDanger" id="cancelDrvModal">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

        </section>

    </main>

    <script src="app.js"></script>
    <script src="drivers.js"></script></body>
</html>
