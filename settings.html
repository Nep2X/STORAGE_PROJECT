<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Settings | Storage Project</title>
<base target="_blank">
</head>
<body>

    <header class="headerSec">
        <h2>STORAGE PROJECT</h2>

        <div class="headerActions">
            <button id="aboutButton">Home</button>
            <button id="profileButton">Profile</button>
            <button id="logoutButton">Logout</button>
        </div>
    </header>

    <main class="mainLayout">

        <aside class="optionSec">
            <div class="sidebarTitle">MENU</div>

            <button id="dashboardButton" class="">Dashboard</button>
            <button id="deliveriesButton" class="">Deliveries</button>
            <button id="driversButton" class="">Drivers</button>
            <button id="customersButton" class="">Customers</button>
            <button id="employeeButton" class="">Employees</button>
            <button id="reportsButton" class="">Reports</button>
            <button id="settingsButton" class="active">Settings</button>

            <div class="sidebarBottom">
                <button id="sidebarLogoutButton">Logout</button>
            </div>
        </aside>

        <section class="dashboardSec">

            <div class="dashboardHead">
                <div class="pageHead">
                    <h3>Settings</h3>
                    <p>Account and system settings</p>
                </div>
            </div>

            <div class="settingsGrid">
                <div class="profileCard">
                    <h3>Profile</h3>
                    <div class="profileRow">
                        <span>Name</span>
                        <strong>Admin User</strong>
                    </div>
                    <div class="profileRow">
                        <span>Email</span>
                        <strong>admin@company.com</strong>
                    </div>
                    <div class="profileRow">
                        <span>Role</span>
                        <strong>Admin</strong>
                    </div>
                    <button class="btnPrimary" type="button">Edit Profile</button>
                </div>

                <div class="profileCard">
                    <h3>Security</h3>
                    <div class="profileRow">
                        <span>Password</span>
                        <strong>********</strong>
                    </div>
                    <div class="profileRow">
                        <span>Last login</span>
                        <strong>Sep 30, 2026</strong>
                    </div>
                    <button class="btnOutline" type="button">Change Password</button>
                </div>
            </div>

        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
