<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to the Delivery Project management system.">
             <link rel="stylesheet" href="style.css"><script src="theme.js?v=2"></script>
      
    <title>Login | Delivery Project</title>
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: var(--background); margin: 0; }
        .loginBox { width: 380px; max-width: 92vw; background: var(--white, #fff);
                    border: 1px solid var(--border, #e5e7eb); border-radius: 12px;
                    padding: 32px 28px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
        .loginBox h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 1px; text-align: center; }
        .loginBox p.sub { margin: 0 0 22px; text-align: center; color: var(--muted, #6b7280); font-size: 14px; }
        .loginBox label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 14px; }
        .loginBox input[type="text"],
        .loginBox input[type="password"] { width: 100%; box-sizing: border-box; padding: 11px 12px;
                    border: 1px solid var(--border, #d1d5db); border-radius: 8px; font: inherit; }
        .showPw { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px;
                  color: var(--muted, #6b7280); }
        .loginBox button[type="submit"] { width: 100%; margin-top: 20px; padding: 12px; }
        #loginError { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px;
        background: var(--destructive-soft); color: var(--destructive); font-size: 14px; }
        .loginMain { width: 100%; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <main class="loginMain">
    <form class="loginBox" id="loginForm" autocomplete="on">
        <h1>Delivery Project</h1>
        <p class="sub">Delivery Management System</p>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <label class="showPw"><input type="checkbox" id="showPw"> Show password</label>

        <button type="submit" class="btnPrimary" id="loginBtn">Log In</button>
        <div id="loginError" role="alert"></div>
    </form>
    </main>

    <script src="login.js"></script>
</body>
</html>
