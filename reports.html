<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Employees | Storage Project</title>
<base target="_blank">
</head>
<body>

    <header class="headerSec">
        <h2>STORAGE PROJECT</h2>

        <div class="headerActions">
            <button id="aboutButton">Home</button>
            <button id="profileButton">Profile</button>
            <button id="logoutButton">Logout</button>
        </div>
    </header>

    <main class="mainLayout">

        <aside class="optionSec">
            <div class="sidebarTitle">MENU</div>

            <button id="dashboardButton" class="">Dashboard</button>
            <button id="deliveriesButton" class="">Deliveries</button>
            <button id="driversButton" class="">Drivers</button>
            <button id="customersButton" class="">Customers</button>
            <button id="employeeButton" class="">Employees</button>
            <button id="reportsButton" class="active">Reports</button>
            <button id="settingsButton" class="">Settings</button>

            <div class="sidebarBottom">
                <button id="sidebarLogoutButton">Logout</button>
            </div>
        </aside>

        <section class="dashboardSec">

            <div class="dashboardHead">
                <div class="pageHead">
                    <h3>Employees</h3>
                    <p>Manage company employees and roles</p>
                </div>
            </div>

            <div class="panel">
                <div class="toolbar">
                    <button class="btnPrimary" type="button">+ Add Employee</button>
                    <input type="text" id="employeeSearch" placeholder="Search employee...">
                    <select name="employeeRole">
                        <option value="">Role</option>
                        <option value="Admin">Admin</option>
                        <option value="Employee">Employee</option>
                        <option value="Driver">Driver</option>
                    </select>
                    <select name="employeeStatus">
                        <option value="">Status</option>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="panel">
                <h2>Employees Overview</h2>
                <p>List of all company employees</p>

                <div class="tableWrapper">
                    <table class="dataTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Position</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Juan Dela Cruz</td>
                                <td>Staff</td>
                                <td>
                                    <select name="role" aria-label="Employee role">
                                        <option value="Employee" selected>Employee</option>
                                        <option value="Admin">Admin</option>
                                        <option value="Driver">Driver</option>
                                    </select>
                                </td>
                                <td>
                                    <select name="status" aria-label="Employee status">
                                        <option value="Active" selected>Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </td>
                                <td>
                                    <select aria-label="Actions">
                                        <option value="">Actions</option>
                                        <option value="view">View</option>
                                        <option value="edit">Edit</option>
                                        <option value="delete">Delete</option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
