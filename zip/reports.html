<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reports.css">
    <title>Dashboard</title>
</head>
<body>

    <section class="headerSec">

        <h2>STORAGE PROJECT</h2>

        <div>

            <button id="aboutButton">Home</button>
            <button id="profileButton">Profile</button>
            <button id="logoutButton">Logout</button>

        </div>
    </section>

    <main class="mainLayout">

    <section class="optionSec">

            <button id="dashboardButton">Dashboard</button>
            <button id="deliveriesButton">Deliveries</button>
            <button id="driversButton">Drivers</button>
            <button id="customersButton">Customers</button>
            <button id="employeeButton">Employees</button>
            <button id="reportsButton">Reports</button>

            <button id="settingsButton">Settings</button>
            <button id="reportsButton">Logout</button>

    </section>

    <section class="dashboardSec">

        <div class="dashboardHead">
            <h3>Reports</h3>
            <p>Reports Overview</p>
        </div>

        <div class="dashboardCards">
            <div>
                <h3>Total Deliveries</h3>
                <p>P-----------</p>
            </div>

            <div>
                <h3>Delivered</h3>
                <p>P-----------</p>
            </div>

            <div>
                <h3>Failed</h3>
                <p>P-----------</p>
            </div>

        </div>

        <div>
            <p>Date Range</p>
            From<input type="text"> -> To<input type="text">

            <select>
                <option value="delivered">Delivered</option>
                <option value="pending">Pending</option>
                <option value="canceled">Canceled</option>
            </select>

            <button>[Generate Report]</button>
        </div>

        <div class="dashboardDelOverview">

            <h2>Delivery Report</h2>

            <div>
                <h2>[Chart / Graph]</h2>
            </div>

            <table>
                <tr>
                    <td>Pending</td>
                    <td>Processing</td>
                    <td>Out</td>
                    <td>Delivered</td>
                </tr>
            </table>

            <table class="recentDeliveryTable">
                <tr>
                    <td>ID</td>
                    <td>Customer</td>
                    <td>Driver</td>
                    <td>Date</td>
                    <td>Status</td>
                </tr>
                <tr>
                    <td>DEL001</td>
                    <td>ABC</td>
                    <td>Mark</td>
                    <td>9/29/2026</td>
                    <td>Delivered</td>
                </tr>
            </table>

            <button>[Export PDF]</button>
            <button>[Export Excel]</button>

        </div>

        

    </section>

    </main>


</body>
</html>
